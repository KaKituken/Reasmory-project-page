<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Reasmory — Reason, Remember, Reassemble">
  <style>
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes spinrev { to { transform: rotate(-360deg); } }
    @keyframes sway    { from { transform: rotate(-1.1deg); } to { transform: rotate(1.3deg); } }
    @keyframes bob     { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes dash    { to { stroke-dashoffset: -48; } }
    @keyframes twinkle { 0%,100% { opacity:.25; transform:scale(.7); } 50% { opacity:1; transform:scale(1.05); } }
    @keyframes fadein  { from { opacity:0; } to { opacity:1; } }

    .orbit  { animation: spin 40s linear infinite; transform-origin: 200px 200px; }
    .cam    { animation: spinrev 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .ring   { animation: spinrev 70s linear infinite; transform-origin: 200px 200px; }
    .wreath { animation: sway 8s ease-in-out infinite alternate; transform-origin: 200px 200px; }
    .bob    { animation: bob 4.5s ease-in-out infinite; }
    .wire   { stroke-dasharray: 7 5; animation: dash 9s linear infinite; }
    .sp     { animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sp2    { animation-delay: 1.1s; }
    .sp3    { animation-delay: 2.2s; }
    .wordmark { animation: fadein 1s ease-out both; }
    .tagline  { animation: fadein 1s ease-out .35s both; }

    @media (prefers-reduced-motion: reduce) {
      .orbit, .cam, .ring, .wreath, .bob, .wire, .sp, .wordmark, .tagline { animation: none; }
    }
  </style>

  <defs>
    <path id="leaf" d="M0 0 C 5 -7 6 -17 1 -25 C -4 -17 -4 -7 0 0 Z"/>
    <g id="flower">
      <ellipse cx="0" cy="-7" rx="3.2" ry="7.5" transform="rotate(-35)" fill="#b3a3e0"/>
      <ellipse cx="0" cy="-7" rx="3.2" ry="7.5" fill="#b3a3e0"/>
      <ellipse cx="0" cy="-7" rx="3.2" ry="7.5" transform="rotate(35)" fill="#b3a3e0"/>
      <circle r="2.2" fill="#8f7fd4"/>
    </g>
    <g id="camicon">
      <rect x="-17" y="-12" width="34" height="24" rx="6" fill="#ffffff" stroke="#3f5c35" stroke-width="3.2"/>
      <circle r="6.5" fill="none" stroke="#3f5c35" stroke-width="3"/>
      <circle r="2" fill="#3f5c35"/>
    </g>
    <path id="arrow" d="M0 -9 L8 5 L-8 5 Z" fill="#3f5c35"/>
    <path id="star" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#a795dd"/>
  </defs>

  <!-- ===================== rosemary wreath ===================== -->
  <g class="wreath">
    <!-- left rosemary stem: arc r=135 from ~-8° to ~-190° (angles from 12 o'clock) -->
    <path d="M 176.6 67.1 A 135 135 0 1 0 223.4 332.9"
          fill="none" stroke="#55703f" stroke-width="3.5" stroke-linecap="round"/>
    <!-- right thin arc, 30° → 150° -->
    <path d="M 267.5 83.1 A 135 135 0 0 1 267.5 316.9"
          fill="none" stroke="#55703f" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

    <!-- leaves along the stem -->
    <g transform="translate(200 200)">
      <g transform="rotate(-8)">
        <use href="#leaf" transform="translate(0 -135) rotate(-48)" fill="#5d7a45"/>
        <use href="#leaf" transform="translate(0 -135) rotate(46) scale(.9)" fill="#708e57"/>
      </g>
      <g transform="rotate(-22)">
        <use href="#leaf" transform="translate(0 -135) rotate(-50) scale(1.05)" fill="#4a6538"/>
        <use href="#leaf" transform="translate(0 -135) rotate(48)" fill="#5d7a45"/>
      </g>
      <g transform="rotate(-36)">
        <use href="#leaf" transform="translate(0 -135) rotate(-46) scale(.85)" fill="#708e57"/>
        <use href="#leaf" transform="translate(0 -135) rotate(50) scale(1.1)" fill="#4a6538"/>
      </g>
      <g transform="rotate(-50)">
        <use href="#leaf" transform="translate(0 -135) rotate(-52)" fill="#5d7a45"/>
        <use href="#leaf" transform="translate(0 -135) rotate(44) scale(.95)" fill="#708e57"/>
      </g>
      <g transform="rotate(-64)">
        <use href="#leaf" transform="translate(0 -135) rotate(-45) scale(1.08)" fill="#4a6538"/>
        <use href="#leaf" transform="translate(0 -135) rotate(50) scale(.9)" fill="#5d7a45"/>
      </g>
      <g transform="rotate(-78)">
        <use href="#leaf" transform="translate(0 -135) rotate(-50) scale(.92)" fill="#708e57"/>
        <use href="#leaf" transform="translate(0 -135) rotate(47)" fill="#4a6538"/>
      </g>
      <g transform="rotate(-92)">
        <use href="#leaf" transform="translate(0 -135) rotate(-47) scale(1.06)" fill="#5d7a45"/>
        <use href="#leaf" transform="translate(0 -135) rotate(51) scale(.88)" fill="#708e57"/>
      </g>
      <g transform="rotate(-106)">
        <use href="#leaf" transform="translate(0 -135) rotate(-51)" fill="#4a6538"/>
        <use href="#leaf" transform="translate(0 -135) rotate(45) scale(1.04)" fill="#5d7a45"/>
      </g>
      <g transform="rotate(-120)">
        <use href="#leaf" transform="translate(0 -135) rotate(-46) scale(.9)" fill="#708e57"/>
        <use href="#leaf" transform="translate(0 -135) rotate(49)" fill="#4a6538"/>
      </g>
      <g transform="rotate(-134)">
        <use href="#leaf" transform="translate(0 -135) rotate(-50) scale(1.07)" fill="#5d7a45"/>
        <use href="#leaf" transform="translate(0 -135) rotate(46) scale(.9)" fill="#708e57"/>
      </g>
      <g transform="rotate(-148)">
        <use href="#leaf" transform="translate(0 -135) rotate(-45)" fill="#4a6538"/>
        <use href="#leaf" transform="translate(0 -135) rotate(50) scale(1.02)" fill="#5d7a45"/>
      </g>
      <g transform="rotate(-162)">
        <use href="#leaf" transform="translate(0 -135) rotate(-49) scale(.9)" fill="#708e57"/>
        <use href="#leaf" transform="translate(0 -135) rotate(47) scale(.95)" fill="#4a6538"/>
      </g>
      <g transform="rotate(-176)">
        <use href="#leaf" transform="translate(0 -135) rotate(-47) scale(.85)" fill="#5d7a45"/>
        <use href="#leaf" transform="translate(0 -135) rotate(50) scale(.8)" fill="#708e57"/>
      </g>
      <g transform="rotate(-190)">
        <use href="#leaf" transform="translate(0 -135) rotate(-30) scale(.75)" fill="#4a6538"/>
      </g>
      <!-- lavender blossoms -->
      <g transform="rotate(-45)"><use href="#flower" transform="translate(0 -140)"/></g>
      <g transform="rotate(-118)"><use href="#flower" transform="translate(0 -141) scale(.9)"/></g>
      <g transform="rotate(-172)"><use href="#flower" transform="translate(0 -139) scale(.8)"/></g>
    </g>
  </g>

  <!-- ===================== dotted orbit ring ===================== -->
  <g class="ring">
    <circle cx="200" cy="200" r="95" fill="none" stroke="#b3a3e0" stroke-width="3"
            stroke-dasharray="0.5 9.5" stroke-linecap="round"/>
  </g>

  <!-- ===================== orbiting cameras ===================== -->
  <g class="orbit">
    <line x1="120" y1="200" x2="280" y2="200" stroke="#9db584" stroke-width="2" stroke-dasharray="4 6" opacity=".55"/>
    <line x1="200" y1="120" x2="200" y2="280" stroke="#9db584" stroke-width="2" stroke-dasharray="4 6" opacity=".55"/>

    <g transform="rotate(0 200 200)">
      <use href="#arrow" transform="translate(200 74)"/>
      <g transform="translate(200 105)"><g class="cam"><g transform="rotate(0)"><use href="#camicon"/></g></g></g>
    </g>
    <g transform="rotate(90 200 200)">
      <use href="#arrow" transform="translate(200 74)"/>
      <g transform="translate(200 105)"><g class="cam"><g transform="rotate(-90)"><use href="#camicon"/></g></g></g>
    </g>
    <g transform="rotate(180 200 200)">
      <use href="#arrow" transform="translate(200 74)"/>
      <g transform="translate(200 105)"><g class="cam"><g transform="rotate(-180)"><use href="#camicon"/></g></g></g>
    </g>
    <g transform="rotate(270 200 200)">
      <use href="#arrow" transform="translate(200 74)"/>
      <g transform="translate(200 105)"><g class="cam"><g transform="rotate(-270)"><use href="#camicon"/></g></g></g>
    </g>
  </g>

  <!-- ===================== wireframe memory cube ===================== -->
  <g fill="none" stroke="#4a6538" stroke-width="2.5" stroke-linejoin="round">
    <polygon class="wire" points="200,140 252,170 252,230 200,260 148,230 148,170"/>
    <path class="wire" d="M200 200 L252 170 M200 200 L200 260 M200 200 L148 170"/>
  </g>

  <!-- solid core cube, gently floating -->
  <g class="bob">
    <path d="M200 177.2 L219.8 188.6 L200 200 L180.2 188.6 Z" fill="#9db584"/>
    <path d="M180.2 188.6 L200 200 L200 222.8 L180.2 211.4 Z" fill="#6b8a52"/>
    <path d="M200 200 L219.8 188.6 L219.8 211.4 L200 222.8 Z" fill="#45623a"/>
  </g>

  <!-- ===================== sparkles ===================== -->
  <g transform="translate(332 118)"><use href="#star" class="sp"/></g>
  <g transform="translate(356 172) scale(.6)"><use href="#star" class="sp sp2"/></g>
  <g transform="translate(348 214)"><circle class="sp sp3" r="4" fill="#a795dd"/></g>

  <!-- ===================== wordmark ===================== -->
  <text class="wordmark" x="420" y="218" font-family="Georgia, 'Times New Roman', serif" font-size="96"
        font-weight="600" textLength="470" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#2f4426">Reas</tspan><tspan fill="#8f7fd4">mory</tspan>
  </text>
  <text class="tagline" x="424" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="17"
        letter-spacing="5" fill="#4a6741" textLength="450" lengthAdjust="spacingAndGlyphs">REASON <tspan fill="#8f7fd4">•</tspan> REMEMBER <tspan fill="#8f7fd4">•</tspan> REASSEMBLE</text>
</svg>
